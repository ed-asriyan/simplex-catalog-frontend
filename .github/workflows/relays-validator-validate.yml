name: Relays validator

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: src/relays-validator

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load Docker images from cache
        uses: actions/cache@v6
        id: cache-docker
        with:
          path: /tmp/docker
          key: relays-validator-docker-${{ hashFiles('src/relays-validator/**') }}

      - name: Load Docker images
        run: |
          if [ -d /tmp/docker ]; then
            for image in /tmp/docker/*.tar; do
            docker load -i $image
            done
          fi

      # The validators share the project (its address is made of its ID), its secret key and the number of tries (README.md).
      - name: Save .env file
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETRY_COUNT: ${{ vars.VALIDATORS_RETRY_COUNT || '3' }}
        shell: bash
        run: |
          {
            echo "SUPABASE_URL=https://$SUPABASE_PROJECT_ID.supabase.co/rest/v1"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "RETRY_COUNT=$RETRY_COUNT"
          } > .env

      - name: Run validation
        run: make validate

      - name: Save Docker images to cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep "^simplex-catalog-relays-validator")
          for image in $images; do
            docker save $image -o /tmp/docker/$(echo $image | tr / _).tar
          done
