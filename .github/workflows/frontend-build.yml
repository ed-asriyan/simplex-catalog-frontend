name: Frontend build

on:
  workflow_call:

defaults:
  run:
    working-directory: src/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # What the website is built with: all of it is in the pages it serves, so none of it is a secret (README.md).
      - name: Save .env file
        env:
          VITE_URL: ${{ vars.WEBSITE_URL }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_SIMPLEX_GROUP_LINK: ${{ vars.SIMPLEX_GROUP_LINK }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_ANALYTICS_MEASHUREMENT_ID: ${{ vars.ANALYTICS_MEASUREMENT_ID }}
        shell: bash
        run: |
          export VITE_SUPABASE_URL="https://$SUPABASE_PROJECT_ID.supabase.co"
          for name in VITE_URL VITE_SUPABASE_URL VITE_SUPABASE_KEY VITE_SIMPLEX_GROUP_LINK VITE_SENTRY_DSN VITE_ANALYTICS_MEASHUREMENT_ID; do
            echo "$name=${!name}"
          done > .env

      - name: Build the app
        run: make prod_build_bundle

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/frontend/dist
