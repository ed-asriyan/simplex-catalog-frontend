name: Relays validator CI (PR)

on:
  pull_request_target:
    branches:
      - master
    paths:
      - 'src/relays-validator/**'
      - '.github/workflows/relays-validator-*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/relays-validator

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'ed-asriyan'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # The validators share the project's address, its secret key and the number of tries (README.md).
      - name: Save .env file
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETRY_COUNT: ${{ vars.VALIDATORS_RETRY_COUNT || '3' }}
        shell: bash
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "RETRY_COUNT=$RETRY_COUNT"
          } > .env

      - name: Append DRY=1 to .env file
        run: echo -e "\nDRY=1" >> .env

      - name: Run validation
        run: make validate
